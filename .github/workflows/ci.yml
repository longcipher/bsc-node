name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
          toolchain: nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-shear,cargo-sort,typos-cli,rumdl,cargo-llvm-cov,cargo-nextest

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - run: just ci

      - name: Generate coverage
        run: just test-coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # The private-network harness: shell scripts, the genesis generator, and the
  # committed genesis files it produces. No node binaries are needed.
  privnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck every shell script
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Compile and lint build-genesis.py
        run: |
          python3 --version
          python3 -I -m py_compile privnet/build-genesis.py
          pipx run ruff check --line-length 120 privnet/build-genesis.py

      - name: Committed genesis files are reproducible from the pinned upstream
        run: python3 -I privnet/build-genesis.py --check

      - name: privnet.sh argument handling
        run: |
          ./privnet/privnet.sh --help >/dev/null
          set +e
          ./privnet/privnet.sh no-such-mode; test $? -eq 2 || exit 1
          GETH_BIN=/nonexistent/geth ./privnet/privnet.sh go; test $? -eq 77 || exit 1
          GETH_BIN=/nonexistent/geth ./privnet/ab-breathe-interval.sh; test $? -eq 77 || exit 1
