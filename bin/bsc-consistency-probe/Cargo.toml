[package]
name = "bsc-consistency-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
hex = "0.4.3"
hpx = { version = "2.5.28", default-features = false, features = ["json", "rustls-tls", "http1", "http2", "stream", "tracing"] }
primitive-types = { version = "0.14.0", features = ["rlp", "serde"] }
rlp = "0.6.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.152"
sha3 = "0.12.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
